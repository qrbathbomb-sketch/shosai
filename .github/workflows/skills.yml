name: Package skills

# skills/ を更新して main に入れると、各スキルの zip を
# リリース「skills-latest」に置き直す(ChatGPT / Claude.ai へのアップロード用)。
on:
  push:
    branches: [main]
    paths: ["skills/**", "scripts/package-skills.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/package-skills.sh skills-dist
      - name: Publish to skills-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete skills-latest --yes --cleanup-tag || true
          gh release create skills-latest skills-dist/*.zip \
            --title "Skills (latest)" \
            --notes "skills/ の最新版。各zipをChatGPTやClaude.aiのスキル画面からアップロードして使う。" \
            --target "${{ github.sha }}" --latest=false
